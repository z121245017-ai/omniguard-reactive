[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 1
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "reactive-lib-omni/=lib/reactive-lib-omni/src/"
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"
